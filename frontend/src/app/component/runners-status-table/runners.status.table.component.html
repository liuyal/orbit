<div class="table-wrapper">

    @if (isLoading) {
    <app-loader [active]="isLoading" [delay]="3000"></app-loader>
    } @else if (error) {
    <app-error-state [error]="error"></app-error-state>
    } @else if (runnersDataSource.data.length === 0) {
    <app-empty-state message="No Runners Found"></app-empty-state>
    } @else {
        <table mat-table [dataSource]="runnersDataSource" class="runners-table">
            <ng-container matColumnDef="NAME">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
                <td mat-cell *matCellDef="let runner">{{runner.name}}</td>
            </ng-container>

            <ng-container matColumnDef="DESIGNATION">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Designation</th>
                <td mat-cell *matCellDef="let runner">{{runner.designation}}</td>
            </ng-container>

            <ng-container matColumnDef="STATUS">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                <td mat-cell *matCellDef="let runner">
                    @if (runner.status === 'online') {
                    <app-status-badge [text]="'ONLINE'"
                        [className]="'active'" [icon]="'fa-circle-check'">
                    </app-status-badge>
                    } @else {
                    <app-status-badge [text]="'OFFLINE'" [className]="'inactive'" [icon]="'fa-circle-xmark'">
                    </app-status-badge>
                    }
                </td>
            </ng-container>

            <ng-container matColumnDef="BUSY">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Busy</th>
                <td mat-cell *matCellDef="let runner">
                    @if (runner.busy) {
                    <app-status-badge [text]="'BUSY'" [className]="'runner busy'"
                        [icon]="'fa-hourglass-half'">
                    </app-status-badge>
                    } @else {
                    <app-status-badge [text]="'IDLE'" [className]="'runner idle'" [icon]="'fa-circle'">
                    </app-status-badge>
                    }
                </td>
            </ng-container>

            <ng-container matColumnDef="USER">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>User</th>
                <td mat-cell *matCellDef="let runner">{{runner.job_trigger_user}}</td>
            </ng-container>

            <ng-container matColumnDef="JOB LINK">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Job Link</th>
                <td mat-cell *matCellDef="let runner">
                    <app-url-link [name]="'LINK'" [href]="runner.job_url"></app-url-link>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    }
</div>
